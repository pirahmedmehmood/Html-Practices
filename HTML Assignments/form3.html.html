<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <center><h1>Registration Form</h1></center>
    <form action="" method="post">
        <fieldset>
            <p>Name: <input type="text"></p>
            <p>Address: <input type="text"></p>
             <p>City: <input type="text"></p>  <p>State/Province <input type="text"></p>
             <p>Zip Code: <input type="text"></p>
             <p>Country: <input type="text"></p>
             <p>Phone: (H) <input type="number"></p>  <p>Fax: <input type="text"></p>
             <p>Phone: (W) <input type="number" name="phonew" id="phonew"> (of able to speak freely)</p>
             <p>Email: <input type="email"></p>
             <p>Company Name: <input type="text"> (Optional)</p>
             <p>Desired Region: <select name="Region" id="other"  required>
                <option value="" >Other</option>
             <option value="Muslim" >Muslim</option>
             <option value="Hindu">Hindu</option>
             <option value="Cristan">Cristan</option>
             <option value="Jew">Jew</option>
             </select>    <p>Other: <input type="text"></p>
             <p>Professional designations earned:</p>
             <input type="checkbox" name="College"> College
             <input type="checkbox" name="Student"> Student
             <input type="checkbox" name="ACAS" > ACAS
             <p>Other <br>
             Designation: <input type="text">
             </p>















        </fieldset>
    </form>
    
</body>
</html>
